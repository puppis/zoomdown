name: Desktop app

# Builds the desktop app for macOS, Linux and Windows and attaches the installers to the GitHub
# release of a version tag (v1.2.3); a manual run builds them as workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app
        if: runner.os != 'macOS'
        run: npx electron-builder --publish never
        env:
          # Unsigned builds: no certificate is looked for.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The macOS runner has an Apple silicon processor, and the app ships native packages for one
      # processor only (the bundlers Vite serves decks with, Rollup and esbuild, and the canvas of
      # the PDF reader): each Mac app is packaged from dependencies installed for its own. Each
      # target names its architecture, since the arch lists of the build configuration would
      # otherwise package both apps from either install.
      - name: Build the app for Apple silicon Macs
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg:arm64 zip:arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install the dependencies for Intel Macs
        if: runner.os == 'macOS'
        run: npx --yes npm@11 ci --cpu=x64 --os=darwin --ignore-scripts
      - name: Build the app for Intel Macs
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg:x64 zip:x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check that each Mac app holds the native packages of its processor
        if: runner.os == 'macOS'
        run: |
          set -e
          for arch in arm64 x64; do
            dir=release/mac-$arch
            [ "$arch" = x64 ] && dir=release/mac
            modules="$dir/ZoomDown.app/Contents/Resources/app/node_modules"
            test -d "$modules/@rollup/rollup-darwin-$arch"
            test -d "$modules/@esbuild/darwin-$arch"
            echo "$arch: $(ls "$modules/@rollup" "$modules/@esbuild" | tr '\n' ' ')"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: zoomdown-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
